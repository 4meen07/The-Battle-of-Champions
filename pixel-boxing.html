<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Boxing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  #wrap { position: relative; }
  canvas {
    background: #2c2c54;
    image-rendering: pixelated;
    border: 4px solid #555;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  h1 { margin-bottom: 10px; letter-spacing: 2px; color: #ffd93d; text-shadow: 2px 2px #000; }
  #hud-info {
    display: flex;
    justify-content: space-between;
    width: 640px;
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    color: #fff;
    text-align: center;
    font-size: 20px;
  }
  #overlay button {
    margin-top: 16px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 16px;
    background: #ffd93d;
    border: none;
    cursor: pointer;
    border-radius: 4px;
  }
  #overlay button:hover { background: #ffe873; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>PIXEL BOXING</h1>
<div id="wrap">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="overlay">
    <div>
      <div style="font-size:28px; margin-bottom:10px;">PIXEL BOXING</div>
      <div style="font-size:14px; line-height:1.6; max-width:420px;">
        A / D — move &nbsp;&nbsp; W — block &nbsp;&nbsp; S — dodge<br>
        J — jab &nbsp;&nbsp; K — hook &nbsp;&nbsp; L — uppercut<br>
        Watch your stamina bar — swinging and blocking both cost stamina.
      </div>
      <button id="startBtn">START FIGHT</button>
    </div>
  </div>
</div>
<div id="hud-info">
  <span>A/D move · W block · S dodge · J jab · K hook · L uppercut</span>
  <span id="roundLabel">Round 1</span>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const roundLabel = document.getElementById('roundLabel');

const GROUND_Y = 300;
const ARENA_LEFT = 40;
const ARENA_RIGHT = 600;

// ---------- Punch definitions ----------
const PUNCHES = {
  jab:      { name: 'Jab',      damage: 6,  range: 70, startup: 6,  active: 4,  recovery: 10, staminaCost: 6,  stagger: 4 },
  hook:     { name: 'Hook',     damage: 12, range: 58, startup: 12, active: 5,  recovery: 18, staminaCost: 12, stagger: 10 },
  uppercut: { name: 'Uppercut', damage: 16, range: 50, startup: 16, active: 5,  recovery: 24, staminaCost: 16, stagger: 16 },
};

function makeFighter(x, facing, isPlayer) {
  return {
    x, y: GROUND_Y,
    facing, // 1 = facing right, -1 = facing left
    w: 34, h: 70,
    health: 100,
    stamina: 100,
    isPlayer,
    state: 'idle', // idle, walk, punch, block, dodge, stagger, hitstun, ko
    punchType: null,
    frame: 0,       // frame counter within current action
    cooldown: 0,     // general action cooldown (recovery)
    color: isPlayer ? '#4dd0e1' : '#ff6b6b',
    flashTimer: 0,
    vx: 0,
  };
}

let player, enemy;
let keys = {};
let roundTime = 60 * 3; // seconds per round, ~3 for demo pacing... adjust below
let timeLeft;
let round = 1;
let gameOver = false;
let paused = true;
let particles = [];
let shake = 0;
let aiTimer = 0;
let aiState = { action: null, timer: 0 };
let lastTs = 0;

function resetFighters() {
  player = makeFighter(180, 1, true);
  enemy = makeFighter(460, -1, false);
}

function startGame() {
  resetFighters();
  round = 1;
  timeLeft = 90; // 90 sec rounds
  gameOver = false;
  paused = false;
  overlay.classList.add('hidden');
  roundLabel.textContent = 'Round ' + round;
  lastTs = performance.now();
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// ---------- Helpers ----------
function dist(a, b) { return Math.abs(a.x - b.x); }

function tryPunch(fighter, type) {
  if (fighter.state !== 'idle' && fighter.state !== 'walk') return;
  const p = PUNCHES[type];
  if (fighter.stamina < p.staminaCost) return;
  fighter.state = 'punch';
  fighter.punchType = type;
  fighter.frame = 0;
  fighter.stamina -= p.staminaCost;
  fighter.hasHit = false;
}

function tryBlock(fighter, on) {
  if (fighter.state === 'punch' || fighter.state === 'stagger' || fighter.state === 'hitstun') return;
  if (on) {
    fighter.state = 'block';
  } else if (fighter.state === 'block') {
    fighter.state = 'idle';
  }
}

function tryDodge(fighter) {
  if (fighter.state !== 'idle' && fighter.state !== 'walk') return;
  if (fighter.stamina < 10) return;
  fighter.state = 'dodge';
  fighter.frame = 0;
  fighter.stamina -= 10;
}

function applyHit(attacker, defender, punchType) {
  const p = PUNCHES[punchType];
  if (defender.state === 'dodge') {
    return; // dodged completely
  }
  if (defender.state === 'block') {
    // blocked: reduced damage, costs defender stamina too
    const chip = Math.ceil(p.damage * 0.2);
    defender.health -= chip;
    defender.stamina = Math.max(0, defender.stamina - 6);
    spawnParticles(defender.x, defender.y - 40, '#8888ff', 4);
    shake = Math.max(shake, 3);
    return;
  }
  // clean hit
  defender.health -= p.damage;
  defender.state = 'hitstun';
  defender.frame = 0;
  defender.hitstunLen = p.stagger;
  spawnParticles(defender.x, defender.y - 40, '#ffd93d', 8);
  shake = Math.max(shake, 6 + p.damage * 0.3);
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 1.5) * 3,
      life: 20 + Math.random() * 10,
      color,
    });
  }
}

// ---------- Update ----------
function updateFighter(f, opponent, dt) {
  // stamina regen
  if (f.state === 'idle' || f.state === 'walk') {
    f.stamina = Math.min(100, f.stamina + 0.25);
  }

  // face opponent
  f.facing = opponent.x > f.x ? 1 : -1;

  if (f.state === 'idle' || f.state === 'walk') {
    f.state = f.vx !== 0 ? 'walk' : 'idle';
  }

  if (f.state === 'punch') {
    const p = PUNCHES[f.punchType];
    f.frame++;
    const total = p.startup + p.active + p.recovery;
    if (f.frame >= p.startup && f.frame < p.startup + p.active && !f.hasHit) {
      // check hit
      const reach = f.range || p.range;
      if (dist(f, opponent) <= p.range && Math.sign(opponent.x - f.x) === f.facing) {
        applyHit(f, opponent, f.punchType);
        f.hasHit = true;
      }
    }
    if (f.frame >= total) {
      f.state = 'idle';
      f.frame = 0;
    }
  } else if (f.state === 'dodge') {
    f.frame++;
    if (f.frame >= 16) { f.state = 'idle'; f.frame = 0; }
  } else if (f.state === 'hitstun') {
    f.frame++;
    if (f.frame >= (f.hitstunLen || 10)) { f.state = 'idle'; f.frame = 0; }
  }

  // movement (only in idle/walk)
  if (f.state === 'idle' || f.state === 'walk') {
    f.x += f.vx;
    f.x = Math.max(ARENA_LEFT, Math.min(ARENA_RIGHT, f.x));
  }

  // keep apart minimum distance
  if (dist(player, enemy) < 40) {
    const push = (40 - dist(player, enemy)) / 2;
    const dir = player.x < enemy.x ? -1 : 1;
    if (player.state !== 'hitstun') player.x += dir * push;
    if (enemy.state !== 'hitstun') enemy.x -= dir * push;
  }

  if (f.health <= 0 && f.state !== 'ko') {
    f.state = 'ko';
    f.health = 0;
    gameOver = true;
  }
}

function playerInput() {
  if (player.state === 'ko' || gameOver) return;
  let vx = 0;
  if (keys['a']) vx -= 3;
  if (keys['d']) vx += 3;
  player.vx = (player.state === 'idle' || player.state === 'walk') ? vx : 0;

  tryBlock(player, !!keys['w']);
  if (keys['s']) tryDodge(player);
  if (keys['j']) { tryPunch(player, 'jab'); keys['j'] = false; }
  if (keys['k']) { tryPunch(player, 'hook'); keys['k'] = false; }
  if (keys['l']) { tryPunch(player, 'uppercut'); keys['l'] = false; }
}

// ---------- Simple AI ----------
function aiInput(dt) {
  if (enemy.state === 'ko' || gameOver) return;
  aiTimer -= dt;
  const d = dist(player, enemy);

  enemy.vx = 0;

  // reactive: if player is winding up a big punch, sometimes block/dodge
  if (player.state === 'punch' && player.frame < PUNCHES[player.punchType].startup) {
    if (Math.random() < 0.03) {
      if (Math.random() < 0.5) tryBlock(enemy, true);
      else tryDodge(enemy);
    }
  } else if (enemy.state === 'block' && Math.random() < 0.05) {
    tryBlock(enemy, false);
  }

  if (aiTimer <= 0 && (enemy.state === 'idle' || enemy.state === 'walk')) {
    aiTimer = 0.3 + Math.random() * 0.5;
    if (d > 65) {
      // approach
      enemy.vx = (player.x > enemy.x ? 1 : -1) * 2.2;
    } else if (d < 40) {
      // back off sometimes
      if (Math.random() < 0.3) enemy.vx = (player.x > enemy.x ? -1 : 1) * 2;
      else {
        const roll = Math.random();
        if (roll < 0.5) tryPunch(enemy, 'jab');
        else if (roll < 0.8) tryPunch(enemy, 'hook');
        else tryPunch(enemy, 'uppercut');
      }
    } else {
      const roll = Math.random();
      if (roll < 0.45) tryPunch(enemy, 'jab');
      else if (roll < 0.7) tryPunch(enemy, 'hook');
      else if (roll < 0.8) tryPunch(enemy, 'uppercut');
      else enemy.vx = (player.x > enemy.x ? 1 : -1) * 1.5;
    }
  }
}

// ---------- Draw ----------
function drawFighter(f) {
  ctx.save();
  let ox = f.x, oy = f.y;
  if (shake > 0) {
    ox += (Math.random() - 0.5) * shake;
    oy += (Math.random() - 0.5) * shake;
  }
  ctx.translate(ox, oy);
  ctx.scale(f.facing, 1);

  // flash white on hitstun
  const bodyColor = f.state === 'hitstun' && f.frame % 4 < 2 ? '#ffffff' : f.color;

  // legs
  ctx.fillStyle = '#333';
  ctx.fillRect(-14, -6, 10, 30);
  ctx.fillRect(4, -6, 10, 30);

  // body offset for lean during dodge
  let leanX = 0, leanY = 0;
  if (f.state === 'dodge') leanX = -8;
  if (f.state === 'block') leanX = 4;

  // torso
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-16 + leanX, -50 + leanY, 32, 46);

  // head
  ctx.fillStyle = '#f2c299';
  ctx.fillRect(-10 + leanX, -68 + leanY, 20, 20);

  // gloves / arms
  ctx.fillStyle = f.isPlayer ? '#e63946' : '#1d3557';
  // rear arm (guard)
  ctx.fillRect(-18 + leanX, -46 + leanY, 12, 12);

  // lead arm animates with punch
  let armX = 10, armY = -40;
  if (f.state === 'punch') {
    const p = PUNCHES[f.punchType];
    const t = f.frame;
    if (t < p.startup) {
      // wind up
      const k = t / p.startup;
      armX = 10 - k * 6;
    } else if (t < p.startup + p.active) {
      // extend
      armX = 10 + (p.range * 0.5);
    } else {
      // recover
      const k = (t - p.startup - p.active) / p.recovery;
      armX = 10 + (p.range * 0.5) * (1 - k);
    }
  } else if (f.state === 'block') {
    armX = 6; armY = -48;
  }
  ctx.fillRect(armX + leanX, armY, 14, 12);

  ctx.restore();
}

function drawArena() {
  // background
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#3a3a6e');
  grad.addColorStop(1, '#2c2c54');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ring ropes
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 150 + i * 18);
    ctx.lineTo(canvas.width, 150 + i * 18);
    ctx.stroke();
  }

  // floor
  ctx.fillStyle = '#4b3b3b';
  ctx.fillRect(0, GROUND_Y + 24, canvas.width, canvas.height - GROUND_Y - 24);
  ctx.fillStyle = '#5b4a4a';
  ctx.fillRect(0, GROUND_Y + 24, canvas.width, 4);
}

function drawBar(x, y, w, h, pct, color, bg) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, pct), h);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
}

function drawHUD() {
  // player bars (left)
  drawBar(20, 20, 220, 16, player.health / 100, '#4dd0e1', '#222');
  drawBar(20, 40, 220, 8, player.stamina / 100, '#ffd93d', '#222');
  ctx.fillStyle = '#fff';
  ctx.font = '12px Courier New';
  ctx.fillText('YOU', 20, 16);

  // enemy bars (right)
  drawBar(400, 20, 220, 16, enemy.health / 100, '#ff6b6b', '#222');
  drawBar(400, 40, 220, 8, enemy.stamina / 100, '#ffd93d', '#222');
  ctx.fillText('RIVAL', 590, 16);

  // timer
  const t = Math.max(0, Math.ceil(timeLeft));
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  ctx.font = 'bold 20px Courier New';
  ctx.fillStyle = '#ffd93d';
  ctx.textAlign = 'center';
  ctx.fillText(mm + ':' + ss, canvas.width / 2, 30);
  ctx.textAlign = 'left';
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
  }
}

function endFight(message) {
  paused = true;
  gameOver = true;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div>
      <div style="font-size:26px; margin-bottom:10px;">${message}</div>
      <button id="restartBtn">FIGHT AGAIN</button>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

// ---------- Main loop ----------
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;

  if (!paused) {
    playerInput();
    aiInput(dt);
    updateFighter(player, enemy, dt);
    updateFighter(enemy, player, dt);
    updateParticles();
    if (shake > 0) shake = Math.max(0, shake - 0.5);

    timeLeft -= dt;

    if (player.state === 'ko') {
      endFight('RIVAL WINS BY KO');
    } else if (enemy.state === 'ko') {
      endFight('YOU WIN BY KO!');
    } else if (timeLeft <= 0) {
      if (player.health > enemy.health) endFight('YOU WIN ON POINTS!');
      else if (enemy.health > player.health) endFight('RIVAL WINS ON POINTS');
      else endFight('DRAW!');
    }
  }

  drawArena();
  // draw further-back fighter first for simple depth
  if (player.x < enemy.x) { drawFighter(player); drawFighter(enemy); }
  else { drawFighter(enemy); drawFighter(player); }
  drawParticles();
  drawHUD();

  if (!gameOver) requestAnimationFrame(loop);
  else if (!paused) requestAnimationFrame(loop);
}

// initial static draw
resetFighters();
timeLeft = 90;
drawArena();
drawFighter(player);
drawFighter(enemy);
drawHUD();
</script>
</body>
</html>
